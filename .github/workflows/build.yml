name: Build psyduck-ios ipa (TrollStore)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install xcodegen ldid

      - name: Download nodejs-mobile iOS runtime
        run: |
          curl -L -o nvm.zip https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-ios.zip
          unzip -q nvm.zip -d nvm
          FRAMEWORK=$(find nvm -maxdepth 4 -type d -name "NodeMobile.xcframework" | head -1)
          echo "framework at: $FRAMEWORK"
          cp -R "$FRAMEWORK" ./NodeMobile.xcframework
          find ./NodeMobile.xcframework -name "node_api_mobile.h" -o -name "*.h" | head -10

      - name: Build payload (ql_runtime lite)
        run: |
          mkdir -p payload_stage
          if [ -d ql_runtime_lite ]; then
            cp -R ql_runtime_lite/. payload_stage/
          fi
          cd payload_stage && zip -qr ../payload.zip . && cd ..
          ls -la payload.zip

      - name: Build helper
        run: |
          xcrun -sdk iphoneos clang -arch arm64 \
            -miphoneos-version-min=14.0 \
            -o PsyduckHelper helper/PsyduckHelper.m \
            -framework Foundation
          file PsyduckHelper

      - name: Stage app sources
        run: |
          # xcodegen 需要的所有文件放平到根目录布局
          mkdir -p Resources
          cp payload.zip Resources/payload.zip
          cp PsyduckHelper Resources/PsyduckHelper

      - name: Generate Xcode project
        run: |
          # Xcode 15.4 读不了 format 77，锁旧版 xcodegen + 显式对象版本
          brew install xcodegen@2.38.0 2>/dev/null || true
          xcodegen generate --spec project.yml
          # 项目文件对象版本降到 Xcode 15.4 可读 (objectVersion 56)
          plutil -replace objectVersion -string 56 Psyduck.xcodeproj/project.pbxproj || true
          grep -m1 objectVersion Psyduck.xcodeproj/project.pbxproj || true

      - name: Build unsigned app
        run: |
          xcodebuild -project Psyduck.xcodeproj \
            -scheme Psyduck -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build 2>&1 | tail -40

      - name: Package ipa
        run: |
          APP=$(find build -type d -name "Psyduck.app" | head -1)
          echo "app at: $APP"
          ldid -S "$APP/Psyduck"
          ldid -S "$APP/PsyduckHelper" || true
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry psyduck-ios.ipa Payload
          ls -la psyduck-ios.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: psyduck-ios
          path: psyduck-ios.ipa
