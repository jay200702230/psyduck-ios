name: Build psyduck-ios ipa (TrollStore)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install xcodegen ldid

      - name: Download nodejs-mobile iOS runtime
        run: |
          curl -L -o nvm.zip https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-ios.zip
          unzip -q nvm.zip -d nvm
          FRAMEWORK=$(find nvm -maxdepth 4 -type d -name "NodeMobile.xcframework" | head -1)
          echo "framework at: $FRAMEWORK"
          cp -R "$FRAMEWORK" ./NodeMobile.xcframework
          find ./NodeMobile.xcframework -name "node_api_mobile.h" -o -name "*.h" | head -10

      - name: Build payload (real runtime from psyduck_app.tar.gz)
        run: |
          # 真 runtime: Android 同款 tar 解包 + iOS 入口覆盖 + 版本标记(装机后自动换血用)
          rm -rf payload_dir
          mkdir -p payload_dir
          tar -xzf runtime/psyduck_app.tar.gz -C payload_dir
          rm -f payload_dir/cookie/jd.ini   # 不带打包时的旧 cookie
          # 权威任务注册表 + a2 签名模块 (对齐 Android initRuntime 的覆盖行为)
          cp runtime/assets_jd.ini payload_dir/config/jd.ini
          cp runtime/a2local.mjs payload_dir/a2local.mjs
          cp ql_runtime_lite/main_ios.mjs payload_dir/main_ios.mjs
          git rev-parse --short HEAD > payload_dir/.payload_version
          ls payload_dir
          echo "parse/jd tasks: $(ls payload_dir/parse/jd | grep -c '^jd_.*\.js$')"

      - name: Build helper
        run: |
          xcrun -sdk iphoneos clang -arch arm64 \
            -miphoneos-version-min=14.0 \
            -o PsyduckHelper helper/PsyduckHelper.m \
            -framework Foundation
          file PsyduckHelper

      - name: Stage app sources
        run: |
          # payload_dir 目录资源 + helper 二进制
          mkdir -p Resources
          cp -R payload_dir Resources/payload_dir
          cp PsyduckHelper Resources/PsyduckHelper

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          # objectVersion 77 → 56（Xcode 15.4 可读）；同时禁用新格式专属的 fileSystemSynchronizedGroups
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' Psyduck.xcodeproj/project.pbxproj
          grep -m1 objectVersion Psyduck.xcodeproj/project.pbxproj
          # PBXFileSystemSynchronizedRootGroup 是 format 77 专属，转成传统 PBXGroup 引用
          if grep -q "PBXFileSystemSynchronizedRootGroup" Psyduck.xcodeproj/project.pbxproj; then
            echo "HAS fs-sync groups — 需要 xcodegen 旧版方案"
            sed -i '' 's/PBXFileSystemSynchronizedRootGroup/PBXLegacyGroupPlaceholder/g' Psyduck.xcodeproj/project.pbxproj || true
          fi

      - name: Build unsigned app
        run: |
          xcodebuild -project Psyduck.xcodeproj \
            -scheme Psyduck -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build || {
              xcodebuild -project Psyduck.xcodeproj -scheme Psyduck -configuration Release -sdk iphoneos \
                -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:" ;
              exit 1; }

      - name: Package ipa
        run: |
          APP=$(find build -type d -name "Psyduck.app" | head -1)
          echo "app at: $APP"
          ls -la "$APP"
          # 主二进制 fake-sign + entitlements（TrollStore 会保留这些权限）
          # 注意: -S 和文件名之间不能有空格, 且必须拼对: -S + ent_app.plist = -Sent_app.plist
          test -f "$APP/Psyduck"
          ldid -Sent_app.plist "$APP/Psyduck"
          # 验尸: entitlements 必须嵌进主二进制, 缺了直接炸 CI（不许静默）
          if ! ldid -e "$APP/Psyduck" | grep -q "no-sandbox"; then
            echo "FATAL: no-sandbox entitlement missing from main binary"
            exit 1
          fi
          echo "== main binary entitlements OK =="
          # helper: no-sandbox + persona-mgmt → posix_spawn 即 root（兜底用）
          if [ -f "$APP/PsyduckHelper" ]; then
            ldid -Sent_helper.plist "$APP/PsyduckHelper"
            ldid -e "$APP/PsyduckHelper" | grep -q "no-sandbox" || { echo "FATAL: helper entitlements missing"; exit 1; }
            echo "== helper entitlements OK =="
          else
            echo "WARN: helper missing"
          fi
          # 嵌入的 NodeMobile 动态库也要 fake-sign
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -type f \( -name "*.dylib" -o -perm +111 \) | while read -r f; do ldid -S "$f" || true; done
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry psyduck-ios.ipa Payload
          ls -la psyduck-ios.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: psyduck-ios
          path: psyduck-ios.ipa
