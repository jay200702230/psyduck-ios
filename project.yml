name: Psyduck
options:
  bundleIdPrefix: com.psyduck
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    ENABLE_BITCODE: "NO"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "YES"

targets:
  Psyduck:
    type: application
    platform: iOS
    sources:
      - path: src
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.psyduck.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: ["-framework", "NodeMobile"]
        FRAMEWORK_SEARCH_PATHS: "$(PROJECT_DIR)"
    dependencies:
      - framework: NodeMobile.xcframework
        embed: true
        codeSign: false
    info:
      path: src/Info.plist
      properties:
        CFBundleDisplayName: psyduck
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: src/Psyduck.entitlements
      properties:
        platform-application: true
        com.apple.private.security.no-sandbox: true
        com.apple.private.persona-mgmt: true
    postBuildScripts:
      - name: Stage helper
        script: |
          cp "$PROJECT_DIR/Resources/PsyduckHelper" "$BUILT_PRODUCTS_DIR/Psyduck.app/PsyduckHelper"
          chmod +x "$BUILT_PRODUCTS_DIR/Psyduck.app/PsyduckHelper"
