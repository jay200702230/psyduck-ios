name: Psyduck
options:
  bundleIdPrefix: com.psyduck
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true

targets:
  Psyduck:
    type: application
    platform: iOS
    sources:
      - path: src
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.psyduck.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
        OTHER_LDFLAGS: ["-framework", "NodeMobile"]
        EMBEDDED_CONTENT_CONTAINS_SWIFT: "YES"
    dependencies:
      - framework: NodeMobile.xcframework
        embed: true
        codeSign: false
    info:
      path: src/Info.plist
      properties:
        CFBundleDisplayName: psyduck
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: src/Psyduck.entitlements
      properties:
        platform-application: true
        com.apple.private.security.no-sandbox: true
        com.apple.private.persona-mgmt: true
